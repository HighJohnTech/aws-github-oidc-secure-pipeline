name: Deploy Infrastructure

# Workflow Triggers
# 1. Automatically on push to main
# 2. Manually from the GitHub Actions UI
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for GitHub OIDCs
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ========================================================================
      # Step 1: Configure AWS Credentials using OIDC
      # ========================================================================
      # GitHub requests an OIDC token.
      # AWS verifies the token and allows this workflow to assume
      # the IAM role stored in the AWS_OIDC_ROLE_ARN repository variable.
      # No long-lived AWS access keys are stored in GitHub.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      # ========================================================================
      # Step 2: Verify AWS Identity
      # ========================================================================
      # Proves which temporary AWS role the workflow successfully assumed.
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ========================================================================
      # Step 3: Checkout Repository
      # ========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================================================
      # Step 4: Setup Terraform
      # ========================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ========================================================================
      # Step 5: Terraform Init
      # ========================================================================
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # ========================================================================
      # Step 6: Terraform Plan
      # ========================================================================
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      # ========================================================================
      # Step 7: Terraform Apply
      # ========================================================================
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ========================================================================
      # Step 8: Output Web Server URL
      # ========================================================================
      - name: Output Web Server URL
        working-directory: terraform
        run: |
          echo "Web Server URL: $(terraform output -raw web_server_url)"
          echo "Access your web server at the URL above"